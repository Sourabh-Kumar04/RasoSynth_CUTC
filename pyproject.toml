[project]
name = "rasosynthtune"
version = "1.0.0"
description = "Production-ready autonomous AI dataset generation system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "RasoSynthTune Team"}
]
keywords = ["ai", "dataset", "machine-learning", "fine-tuning", "data-engineering"]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers"]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "huggingface-hub>=0.25.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pyarrow>=18.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "structlog>=24.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "prometheus-client>=0.21.0",
    "trafilatura>=1.9.0",
    "playwright>=1.47.0",
    "beautifulsoup4>=4.12.0",
    "scrapy>=2.11.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.10",
    "pypdf2>=3.0.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "pygments>=2.18.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "datasets>=3.0.0",
    "qdrant-client>=1.11.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "tenacity>=9.0.0",
    "langdetect>=1.0.9",
    "pyjwt>=2.9.0",
    "redis[hiredis]>=5.2.0",
    "aiosqlite>=0.22.1",
    "boto3>=1.35.0",
    "kaggle>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
]
flower = ["flower>=2.0.0"]
ray = ["ray>=2.35.0"]
# Fine-tuning dependencies — install with: pip install -e ".[finetuning]"
# Unsloth is optional (NVIDIA GPU only). Install separately if needed.
finetuning = [
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "trl>=0.9.0",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
]

[project.scripts]
dataset-engine = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore=tests/test_migration_safety.py"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
