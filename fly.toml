app = "rasosynthtune-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  AIR_GAPPED_MODE = "false"
  ENABLE_CELERY = "false"

[mounts]
  source = "rasosynthtune_data"
  destination = "/app/outputs"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
