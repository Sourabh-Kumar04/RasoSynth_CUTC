services:
  # RasoSynthTune Free Tier Cloud Control Plane on Render
  # Handles API, DBOM signing, synthetic generation, and dispatches compute to Modal/Colab
  - type: web
    name: rasosynthtune-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # 100% Free Tier ($0/month)
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AIR_GAPPED_MODE
        value: "false"
      - key: ENABLE_CELERY
        value: "false"
      - key: WORKERS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
      # JWT Authentication (Auto-generated 64-char cryptographically secure secret)
      - key: JWT_SECRET
        generateValue: true
      # Database: Remote PostgreSQL connection string (e.g. Neon, Supabase, Render Postgres)
      # If left empty, the server automatically defaults to SQLite.
      - key: POSTGRES_URL
        sync: false
      # AI Provider API Keys from your .env
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: AIKOSH_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Serverless Cloud GPU Training (Modal Labs $30/mo free compute)
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: RUNPOD_API_KEY
        sync: false
    healthCheckPath: /health
