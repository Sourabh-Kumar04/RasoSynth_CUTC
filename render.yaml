services:
  # RasoSynthTune 100% FREE Tier API Server on Render
  - type: web
    name: rasosynthtune-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # 100% Free Tier ($0/month)
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AIR_GAPPED_MODE
        value: "false"
      - key: ENABLE_CELERY
        value: "false"
      # Add your free API key (e.g. Gemini 1.5 Flash has a free tier)
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
    healthCheckPath: /health
