services:
  # RasoSynthTune Free Tier Cloud Control Plane on Render
  # Handles API, DBOM signing, synthetic generation, and dispatches compute to Modal/Colab
  - type: web
    name: rasosynthtune-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # 100% Free Tier ($0/month)
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AIR_GAPPED_MODE
        value: "false"
      - key: ENABLE_CELERY
        value: "false"
      - key: WORKERS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Free AI Provider keys (e.g. Gemini 1.5 Flash, Groq)
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # Modal Labs Free Tier ($30/mo free compute) for offloaded fine-tuning
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
    healthCheckPath: /health
