services:
  # RasoSynthTune Production API Server
  - type: web
    name: rasosynthtune-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AIR_GAPPED_MODE
        value: "false"
      - key: ENABLE_CELERY
        value: "false"
      # In cloud environments, LLM API keys provide generation & judging
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # Optional external database (auto-falls back to SQLite if omitted)
      - key: POSTGRES_URL
        fromDatabase:
          name: rasosynthtune-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rasosynthtune-redis
          property: connectionString
    healthCheckPath: /health

databases:
  - name: rasosynthtune-db
    plan: starter
    databaseName: dataset_engine
    user: dataset_user
