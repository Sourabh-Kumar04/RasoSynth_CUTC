{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cloud-secrets
  labels:
    app.kubernetes.io/name: rasosynthtune
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.secrets.hfToken | default "" | quote }}
  MODAL_TOKEN_ID: {{ .Values.secrets.modalTokenId | default "" | quote }}
  MODAL_TOKEN_SECRET: {{ .Values.secrets.modalTokenSecret | default "" | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKey | default "raso_minio_admin" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretKey | default "raso_minio_secret_key" | quote }}
{{- end }}
