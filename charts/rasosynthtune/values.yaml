# Default values for rasosynthtune chart.

global:
  environment: production
  domain: rasosynthtune.internal

api:
  replicaCount: 2
  image:
    repository: ghcr.io/sourabh-kumar04/rasosynthtune-api
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: "4000m"
      memory: "8Gi"
    requests:
      cpu: "1000m"
      memory: "2Gi"
  env:
    FASTAPI_WORKERS: "4"
    LOG_LEVEL: "INFO"

worker:
  replicaCount: 2
  image:
    repository: ghcr.io/sourabh-kumar04/rasosynthtune-worker
    tag: "latest"
    pullPolicy: IfNotPresent
  capacity: 8
  resources:
    limits:
      cpu: "8000m"
      memory: "16Gi"
      nvidia.com/gpu: 1
    requests:
      cpu: "2000m"
      memory: "4Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/sourabh-kumar04/rasosynthtune-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

redis:
  host: "redis.rasosynthtune.svc.cluster.local"
  port: 6379

postgres:
  host: "postgres.rasosynthtune.svc.cluster.local"
  port: 5432
  database: "rasosynthtune"
  user: "raso_admin"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "rasosynthtune-api"
  hosts:
    - host: app.rasosynthtune.internal
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: frontend
