services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataset_engine}
      POSTGRES_USER: ${POSTGRES_USER:-dataset_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be explicitly provided}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataset_user} -d ${POSTGRES_DB:-dataset_engine}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M

  qdrant:
    image: qdrant/qdrant:v1.14
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__MAX_REQUEST_SIZE: 8388608
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback-only: the nginx proxy reaches the app over the internal
      # network. Only :80 on the proxy is the intended public surface.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-dataset_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be explicitly provided}}@postgres:5432/${POSTGRES_DB:-dataset_engine}
      QDRANT_URL: http://qdrant:6333
      ENABLE_CELERY: "true"
      PYTHONUNBUFFERED: "1"
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    # NOTE (P0): the NVIDIA GPU reservation was removed from the API service.
    # Local GPU training must run via a dedicated GPU service/host; reserving
    # all GPUs on the API container starved every other consumer.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/.venv/bin/celery", "-A", "workers.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-dataset_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be explicitly provided}}@postgres:5432/${POSTGRES_DB:-dataset_engine}
      QDRANT_URL: http://qdrant:6333
      ENABLE_CELERY: "true"
      PYTHONUNBUFFERED: "1"
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/.venv/bin/celery", "-A", "workers.celery_app.celery_app", "beat", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-dataset_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be explicitly provided}}@postgres:5432/${POSTGRES_DB:-dataset_engine}
      QDRANT_URL: http://qdrant:6333
      ENABLE_CELERY: "true"
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: production
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  flower:
    # NOTE (P0): Flower ships without authentication in this image, so it is
    # intentionally NOT proxied by nginx (see nginx.conf) and is bound
    # loopback-only: operators reach it via the host or a port-forward only.
    image: mher/flower:2.0
    ports:
      - "127.0.0.1:5555:5555"
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    profiles:
      - monitoring

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
  backups:
