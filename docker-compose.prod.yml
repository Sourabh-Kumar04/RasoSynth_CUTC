version: "3.8"

services:
  # ── 1. PostgreSQL with pgvector (Hybrid Semantic + Lexical Search) ────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rasosynthtune-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-rasosynthtune}
      - POSTGRES_USER=${POSTGRES_USER:-raso_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-raso_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raso_admin} -d ${POSTGRES_DB:-rasosynthtune}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 2. Redis 7 (Semantic Prompt Cache & Cluster Work Queue) ─────────────
  redis:
    image: redis:7-alpine
    container_name: rasosynthtune-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── 3. MinIO S3-Compatible Object Store (Datasets & LoRA Weights) ────────
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: rasosynthtune-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-raso_minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-raso_minio_secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── 4. FastAPI Backend Application Server ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rasosynthtune-api-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - FASTAPI_WORKERS=4
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-raso_admin}:${POSTGRES_PASSWORD:-raso_secret_password}@postgres:5432/${POSTGRES_DB:-rasosynthtune}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=rasosynthtune-artifacts
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-raso_minio_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-raso_minio_secret_key}
      - JWT_SECRET=${JWT_SECRET:-super-secret-production-rasosynth-jwt-key-2026}
      - DOWNLOAD_SIGNING_SECRET=${DOWNLOAD_SIGNING_SECRET:-production-signing-secret-key-32chars}
      - VLLM_BASE_URL=http://vllm-engine:8000/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G

  # ── 5. Distributed Synthesis & Alignment Worker ─────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rasosynthtune-worker
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "core.orchestrator_pkg.distributed_worker"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-raso_admin}:${POSTGRES_PASSWORD:-raso_secret_password}@postgres:5432/${POSTGRES_DB:-rasosynthtune}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=rasosynthtune-artifacts
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-raso_minio_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-raso_minio_secret_key}
      - WORKER_CAPACITY=8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 16G

  # ── 6. Next.js 14 Dashboard Frontend ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rasosynthtune-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: rasosynthtune-net
