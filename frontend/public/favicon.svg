<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Obsidian Tile Background -->
    <linearGradient id="fav-bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="50%" stop-color="#0f0f17"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>

    <!-- Metallic & Signal-Orange Rim -->
    <linearGradient id="fav-rim" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#f26625" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="fav-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f26625" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f26625" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary Flame Gradient -->
    <linearGradient id="fav-primary" x1="10" y1="8" x2="30" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fed7aa"/>
      <stop offset="45%" stop-color="#f26625"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Harmonic Accent Wave -->
    <linearGradient id="fav-accent" x1="28" y1="12" x2="14" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f26625"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="1.5" y="1.5" width="37" height="37" rx="10" fill="url(#fav-bg)" stroke="url(#fav-rim)" stroke-width="1.2"/>

  <!-- Ambient Glow -->
  <circle cx="20" cy="19" r="14" fill="url(#fav-glow)"/>

  <!-- Subtle Hex Calibration Guide -->
  <path d="M20 7.5L30.5 13.5V25.5L20 31.5L9.5 25.5V13.5L20 7.5Z" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.08" stroke-dasharray="2 2"/>

  <!-- Harmonic Counter-Wave ('S' dynamic confluence) -->
  <path d="M26.5 12C28.5 15 28 19 24.5 21C21 23 18.5 24.5 15.5 28" stroke="url(#fav-accent)" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Sculpted Synthesis 'R' Monogram -->
  <path d="M13.5 28.5V12C13.5 11.17 14.17 10.5 15 10.5H21C24.866 10.5 27.5 12.8 27.5 16C27.5 19.1 25 21.2 21.2 21.2H14M19.8 21.2L27 28.5" stroke="url(#fav-primary)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Specular Apex Flare -->
  <path d="M21 13.5L21.7 15.2L23.4 16L21.7 16.8L21 18.5L20.3 16.8L18.6 16L20.3 15.2L21 13.5Z" fill="#ffffff" opacity="0.95"/>

  <!-- Vertex Dots -->
  <circle cx="13.5" cy="11.5" r="1" fill="#ffffff" opacity="0.9"/>
  <circle cx="27" cy="28.5" r="1.2" fill="#f26625"/>
</svg>
