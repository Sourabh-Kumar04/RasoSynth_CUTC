name: RasoSynthTune CI & Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Regression & Verification Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute CLI and Core Regression Tests
        run: |
          pytest tests/test_cli.py \
                 tests/test_live_job_run.py \
                 tests/test_regressive_e2e_workflows.py \
                 tests/test_generation_modes.py \
                 tests/test_validation.py \
                 tests/test_quality_deterministic.py \
                 -v --tb=short

      - name: Verify CLI Command Surface
        run: |
          python cli.py --help
          python main.py --help
          python cli.py generate --domain "Indian Taxation & GST" --size 3 --output-dir outputs/ci_test
          python cli.py audit --dataset outputs/ci_test/dataset_distillation_3.jsonl
          python cli.py recipe --framework axolotl --dataset outputs/ci_test/dataset_distillation_3.jsonl

  frontend-build:
    name: Next.js 14 Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build
