name: RasoSynthTune CI & Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Regression & Verification Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute CLI and Core Regression Tests
        run: |
          pytest tests/test_cli.py \
                 tests/test_live_job_run.py \
                 tests/test_regressive_e2e_workflows.py \
                 tests/test_generation_modes.py \
                 tests/test_validation.py \
                 tests/test_quality_deterministic.py \
                 -v --tb=short

      - name: Execute Cognitive Engine, Cloud GPU, and DBOM Suites
        run: |
          pytest tests/test_benchmark_pipeline.py \
                 tests/test_health_check_cli.py \
                 tests/test_resume_job.py \
                 tests/test_websocket_stream.py \
                 tests/test_cli_export.py \
                 tests/test_e2e_pipeline_integration.py \
                 tests/test_finetune_serverless.py \
                 tests/test_hf_and_dbom_card.py \
                 tests/test_ui_palette_and_audio.py \
                 tests/test_dbom_and_planner.py \
                 tests/test_synthesis_engines_and_judge.py \
                 -v --tb=short

      - name: Verify CLI Command Surface & Diagnostic Tools
        run: |
          python cli.py --help
          python main.py --help
          python scripts/health_check.py --json
          python scripts/export_hf.py --help
          python scripts/resume_job.py --help
          python cli.py generate --domain "Indian Taxation & GST" --size 3 --output-dir outputs/ci_test
          python cli.py generate --domain "Air-Gapped Sovereign AI" --size 2 --engine vllm --output-dir outputs/ci_test_vllm
          python cli.py audit --dataset outputs/ci_test/dataset_distillation_3.jsonl
          python cli.py recipe --framework axolotl --dataset outputs/ci_test/dataset_distillation_3.jsonl
          python cli.py publish --dataset-dir outputs/ci_test --repo-id rasosynthtune/ci-test-v1 --dry-run

  frontend-build:
    name: Next.js 14 Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build
