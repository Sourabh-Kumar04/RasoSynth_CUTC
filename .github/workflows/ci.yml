# RasoSynthTune CI & Quality Gate
#
# What this gates on (all jobs must pass; no continue-on-error on any gate job):
#   - lint: ruff --select RUF100 only.
#   - backend-test: the FULL pytest suite (pytest -q over tests/).
#   - frontend-build: tsc --noEmit (npm run type-check) + Next.js production build.
#
# What it deliberately does NOT gate on, and why:
#   - Full `ruff check` (7,008 errors at last count on this branch): gating on it
#     would red every run. Only RUF100 is currently clean repo-wide (0 errors);
#     F401 is 647 errors and F541 is 1 error (a notebook cell). The backlog is a
#     follow-up, not a gate. Do not widen the lint select without first landing
#     the fixes that make the new rules clean.
#   - `ruff format` check: the repo declares no formatter (no .pre-commit config,
#     no [tool.ruff.format] in pyproject.toml), so there is nothing to check
#     against. Do not invent a format gate.
#   - mypy: currently blocked by environment/config issues (bcrypt used but not
#     declared as a dependency, api.routes imported as untyped, duplicate-module
#     complaints for scripts/). mypy is NOT gated until those are resolved; do
#     not add a mypy step that is expected to fail.
#   - No Postgres/Redis services are provisioned here, so the backend suite runs
#     exactly as it does on a developer machine without those services: the app
#     falls back to SQLite (outputs/rasosynthtune.db) and in-memory cache, and
#     tests that need a live database are skipped. CI therefore does NOT prove
#     Postgres/Redis behaviour; it proves the SQLite/memory fallback path only.
#   - No dependency upgrades are made by this workflow. Dependabot, if enabled
#     in repo settings, should stay security-fix-only; this workflow performs
#     no bulk upgrades and pins only the runtimes below.
#
# Pinned runtimes (matching the repo's declared versions; do not upgrade here):
#   - Python 3.12 (pyproject requires >=3.11; the repo venv and prior CI use 3.12)
#   - Node.js 20 (frontend uses Next 14.2.5; @types/node 20.x)
name: RasoSynthTune CI & Quality Gate

on:
  push:
    branches: [ master, main, optimize/industry-standard ]
  pull_request:
    branches: [ master, main, optimize/industry-standard ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, clean rules only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Gate: RUF100 only. See the header comment for why the full ruff
      # backlog (7,008 errors) is not gated.
      - name: Ruff check (RUF100 only)
        run: ruff check --select RUF100 .

  backend-test:
    name: Backend Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Full suite, not the old hand-picked subset. Any failure fails the job
      # (no continue-on-error). Known caveat, documented in the header: no
      # Postgres/Redis services run here, so this covers the SQLite/memory
      # fallback path only.
      - name: Full pytest suite
        run: pytest -q

  frontend-build:
    name: Next.js 14 Type Check & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run type-check

      - name: Build Next.js application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build
